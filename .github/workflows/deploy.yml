name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          # Le indicamos dónde está el package-lock.json del cliente para la caché
          cache-dependency-path: "./client/package-lock.json"

      - name: Install dependencies
        # Entramos a la carpeta client para instalar
        run: npm ci
        working-directory: ./client

      - name: Build project
        # Entramos a la carpeta client para compilar
        run: npm run build
        working-directory: ./client

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./client/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
